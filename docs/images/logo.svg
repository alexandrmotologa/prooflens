<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#161e31" />
    </linearGradient>
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Background circuit constraint grid lines -->
  <path d="M120 180 H392 M120 256 H392 M120 332 H392 M180 120 V392 M256 120 V392 M332 120 V392" 
        stroke="url(#gridGrad)" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />

  <!-- Outer lens optic ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#lensRing)" stroke-width="12" filter="url(#glow)" />
  <circle cx="256" cy="256" r="132" fill="#0b1329" fill-opacity="0.8" stroke="#334155" stroke-width="2" />

  <!-- R1CS DAG Nodes and Constraints -->
  <!-- Node A (Input 1) -->
  <circle cx="196" cy="216" r="16" fill="#06b6d4" />
  <text x="196" y="221" font-family="monospace" font-size="14" font-weight="bold" fill="#04121e" text-anchor="middle">A</text>

  <!-- Node B (Input 2) -->
  <circle cx="196" cy="296" r="16" fill="#8b5cf6" />
  <text x="196" y="301" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>

  <!-- Constraint Node (A * B) -->
  <rect x="256" y="240" width="32" height="32" rx="8" fill="#10b981" transform="rotate(45 272 256)" filter="url(#glow)" />
  <text x="272" y="261" font-family="monospace" font-size="16" font-weight="bold" fill="#042316" text-anchor="middle">×</text>

  <!-- Node C (Output) -->
  <circle cx="340" cy="256" r="18" fill="#38bdf8" />
  <text x="340" y="262" font-family="monospace" font-size="14" font-weight="bold" fill="#082f49" text-anchor="middle">C</text>

  <!-- Directed edges connecting nodes -->
  <path d="M212 224 L256 246" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
  <path d="M212 288 L256 266" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" />
  <path d="M288 256 L322 256" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

  <!-- Lens handle / telescope sight overlay -->
  <path d="M360 360 L420 420" stroke="url(#lensRing)" stroke-width="22" stroke-linecap="round" filter="url(#glow)" />
  <path d="M375 375 L415 415" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6" />

  <!-- Focal spark -->
  <circle cx="256" cy="256" r="4" fill="#ffffff" />
</svg>
